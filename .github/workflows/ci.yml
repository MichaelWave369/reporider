name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run typecheck
        run: npm run typecheck

      - name: Run safety fixtures
        run: npm run test:safety
      - name: RR-A01 agent rail negative controls and CLI smoke
        run: npm run agent:test
      - name: RR-A02 MCP stdio discovery and deny smoke
        run: npm run mcp:test
      - name: RR-A05 local operator inbox and terminal negative controls
        run: npm run operator:test
      - name: RR-A06 local evidence ledger tamper controls
        run: npm run ledger:test
      - name: RR-A07 independent ledger checkpoint rollback controls
        run: npm run checkpoint:test
      - name: RR-A08 local operator audit reporting and negative controls
        run: npm run audit:test
